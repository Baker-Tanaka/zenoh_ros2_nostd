[build]
target = "thumbv6m-none-eabi"

[unstable]
build-std = ["alloc", "core", "compiler_builtins"]

[target.thumbv6m-none-eabi]
rustflags = [
    "-C",
    "linker=flip-link",
    # --nmagic, -Tlink.x, -Tdefmt.x are already provided by the workspace root
    # .cargo/config.toml (cfg(all(target_arch="arm", target_os="none")) section).
    # Do NOT repeat them here — duplicate linker args cause "region BOOT2 already defined".
    "-C",
    "llvm-args=--inline-threshold=5",
    "-C",
    "no-vectorize-loops",
]
