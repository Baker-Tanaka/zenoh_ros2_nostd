[target.'cfg(all(target_arch = "arm", target_os = "none"))']

rustflags = [
  "-C",
  "linker=flip-link",
  "-C",
  "link-arg=--nmagic",
  "-C",
  "link-arg=-Tlink.x",
  "-C",
  "link-arg=-Tdefmt.x",
  "-C",
  "llvm-args=--inline-threshold=5",
  "-C",
  "no-vectorize-loops",
]

# Default target removed — library is MCU-agnostic.
# To check no_std compatibility:
#   cargo check --target thumbv6m-none-eabi
# To run host tests:
#   cargo test
# To run WASM no_std tests:
#   cargo test --target wasm32-wasip1 --no-default-features

[target.wasm32-wasip1]
runner = "wasmtime"

[env]
DEFMT_LOG = "debug"
