name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel in-progress on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-doc-

      # Build docs with `log` feature (no_std + no defmt) so they work on docs.rs.
      # --no-deps keeps the output focused on this crate.
      # RUSTDOCFLAGS="-D warnings" turns all doc warnings into errors.
      - name: cargo doc
        run: cargo doc --no-default-features --features log --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Add a redirect from the root so GitHub Pages lands on the right page.
      - name: Add root redirect
        run: |
          echo '<meta http-equiv="refresh" content="0; url=zenoh_ros2_nostd/">' \
            > target/doc/index.html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
