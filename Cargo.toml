[package]
name = "zenoh-ros2-nostd"
version = "0.1.0"
edition = "2021"
description = "no_std ROS2 topic pub/sub over Zenoh for embedded systems with embassy"
license = "Apache-2.0"

[lib]
name = "zenoh_ros2_nostd"

[features]
default = ["defmt"]
defmt = ["dep:defmt", "embassy-sync/defmt", "embassy-time/defmt"]
log = ["dep:log"]
alloc = []

[dependencies]
# Core (no_std)
serde = { version = "1.0", default-features = false, features = ["derive"] }
heapless = { version = "0.8", features = ["serde"] }
embedded-io-async = "0.6"
embassy-sync = { version = "0.8", default-features = false }
embassy-time = { version = "0.5", default-features = false }

# Logging (optional — user chooses defmt or log)
defmt = { version = "1.0", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]

# cargo build/run
[profile.dev]
codegen-units = 1
debug = true
debug-assertions = true
incremental = false
opt-level = 0
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false
